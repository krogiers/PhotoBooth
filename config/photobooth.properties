# Active booth config for "Tibo's uitzwaai feestje".
# This file is git-ignored. Every key the app reads is listed here with its
# default; uncomment / change the ones you need. Restart the app to pick up
# changes — no rebuild.

# ---- Camera ---------------------------------------------------------------
# auto        - Pi camera (rpicam-still) on Linux, else a Mac webcam via
#               imagesnap if installed, else a synthetic placeholder photo.
# pi          - force the Pi Camera Module (rpicam-still).
# webcam      - force imagesnap (Mac built-in/USB webcam).
# placeholder - force the synthetic placeholder photo, on any OS.
camera.type=auto

# Which physical camera to use when several are attached.
#   pi / linux auto : a camera INDEX. Blank means camera 0 (not "let libcamera
#                     decide"), so the same camera is used every boot. List
#                     them with `rpicam-still --list-cameras`.
#   webcam (macOS)  : a device NAME from `imagesnap -l`. Blank = macOS's
#                     default camera, which can change between runs — set it
#                     to pin one. The self-view stream uses the same camera.
camera.device=

# ---- GPIO (Raspberry Pi) -----------------------------------------------------
# BCM pin numbers, not physical header pin numbers.
gpio.button.pin=17
gpio.led.pin=27

# ---- Timing ---------------------------------------------------------------
countdown.seconds=3

# Minimum time "Smile!" stays on screen after the countdown, in milliseconds.
# The photo is actually taken during the 3-2-1, so without a hold "Smile!"
# can flash by before the result screen appears.
smile.hold.ms=1200

# How long the merged photo + download QR stay on screen before the idle
# screen (with the live self-view) returns.
result.display.seconds=15

# How often the idle/countdown self-view grabs a fresh still from the camera.
# Only used when there's no live preview stream (forced placeholder/webcam
# camera, or macOS without ffmpeg).
preview.interval.ms=1000

# ---- Screens ------------------------------------------------------------------
# The booth screen always runs. A second "picker" screen is the layout gallery
# + one big red "take the photo" button (no download, no photo shown) for an
# operator beside the booth. Needs overlay.selection.enabled=true.
secondscreen.enabled=true

# Which display each screen uses (0 = first display, usually the primary).
#   booth  : if this display is missing the booth still runs, on the primary.
#   picker : appears ONLY on its display — if that display isn't attached,
#            there is simply no picker screen (no fallback).
screen.booth.display=1
screen.picker.display=0

# Kiosk mode per screen: true = borderless window covering that whole display,
# sized to whatever resolution it runs at; false = a normal resizable window
# (window.width/height). PHOTOBOOTH_WINDOWED env var forces windowed for both.
screen.booth.fullscreen=true
screen.picker.fullscreen=true

# Window size for a screen whose *.fullscreen is false (a dev run). Blank =
# auto: ~80% of whatever display the window lands on.
# window.width=1280
# window.height=800

# The idle screen's fixed elements: whether each shows, and where.
#   position: top-left | top-center | top-right | center-left | center
#             | center-right | bottom-left | bottom-center | bottom-right
# Styling is in config/kiosk/kiosk.css — this is only whether/where.
kiosk.qr.layout.enabled=true
kiosk.qr.layout.position=bottom-left
kiosk.qr.recovery.enabled=true
kiosk.qr.recovery.position=bottom-right
kiosk.taphint.position=bottom-center

# ---- Download server + tunnel ----------------------------------------------
# Port the local server listens on. A Cloudflare quick tunnel (cloudflared
# must be installed, this machine needs outbound internet) exposes it publicly
# so guests reach their photo over mobile data.
server.port=8080

# ---- Photo storage ---------------------------------------------------------
# Where photos are written, relative to the launch directory. Each run goes
# under data.dir/<subfolder>/ (originals/ and merged/). The subfolder is
# today's date unless data.subdir is set. QR codes are never written to disk.
data.dir=data
# data.subdir=tibo-uitzwaai

# ---- Overlay -------------------------------------------------------------------
# Transparent PNG (camera aspect ratio) drawn on top of every capture, unless
# overlay.selection.enabled and the guest picked another on their phone.
overlay.file=config/overlay.png
overlay.selection.enabled=true
overlays.dir=config/overlays

# ---- Language ------------------------------------------------------------------
# Built in: en, nl. A new language just needs config/i18n/<code>.properties —
# no rebuild. See src/main/resources/i18n/en.properties for the full key list.
ui.language=nl

# ---- Remote start ------------------------------------------------------------
# true (default): the phone's /choose page shows a "Take the photo" button
# that starts the countdown and then shows the guest their finished photo.
remote_start.enabled=true

# ---- Phone-page branding --------------------------------------------------
# Optional wordmark at the top of every phone page. Full rebrand: drop files
# into config/web/ (style.css, logo.png, *.mustache) — see docs/customising.md.
web.brand.name=

# ---- Idle-screen decoration ("Tibo's uitzwaai feestje") ------------------
# A numbered list of image layers (decor.<n>.*) plus an optional text title.
# Files go in config/decor/. Use transparent PNGs so a layer doesn't show as
# a rectangle over the live self-view.
#   decor.<n>.file      path to the image (gaps in the numbering are fine)
#   decor.<n>.position  top-left | top-center | top-right | center-left
#                       | center | center-right | bottom-left | bottom-center | bottom-right
#   decor.<n>.width     px, or NN% of the screen width  (give width OR height;
#   decor.<n>.height    px, or NN% of the screen height   the other scales)
#   decor.<n>.rotate    degrees clockwise about the centre
#
# NOTE: wimpels.png and wegwijzer.png still have an opaque/gradient background;
# cut them out to transparent or they'll show as a rectangle over the feed.

# Flags, tilted into the top-left corner
decor.1.file=config/decor/wimpels.png
decor.1.position=top-left
decor.1.width=48%
decor.1.rotate=-10

# The party name where the title used to be
decor.2.file=config/decor/uitzwaaifeest.png
decor.2.position=top-center
decor.2.width=42%

# The signpost, top-right
decor.3.file=config/decor/wegwijzer.png
decor.3.position=top-right
decor.3.height=58%

# Optional text title (blank = use the image above instead). Shadow is the
# `.decor-title` rule in config/kiosk/kiosk.css.
decor.title.text=
decor.title.font=
decor.title.size=64
decor.title.color=#ffffff
decor.title.position=top-center

# ---- Kiosk styling ------------------------------------------------------------
# All kiosk-screen styling is in src/main/resources/kiosk/kiosk.css, including
# the frame around the live self-view (`.kiosk-stage`: -fx-padding is the
# border width, -fx-background-color its colour; 0 padding = edge-to-edge).
# Drop config/kiosk/kiosk.css to override per event — layered on top, only the
# rules you change. No key here — just the file's presence.

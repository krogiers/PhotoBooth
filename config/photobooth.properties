# Copy to photobooth.properties (same directory) and adjust for your hardware/venue.
# photobooth.properties is git-ignored so per-booth settings don't get committed.

# Which Camera implementation to use:
#   auto        - Pi camera (rpicam-still) on Linux, else a Mac webcam via
#                 imagesnap if installed, else a synthetic placeholder photo.
#   pi          - force the Pi Camera Module (rpicam-still), e.g. when testing
#                 on the Pi itself.
#   webcam      - force imagesnap (Mac built-in/USB webcam).
#   placeholder - force the synthetic placeholder photo, on any OS.
camera.type=auto

# BCM pin numbers, not physical header pin numbers.
gpio.button.pin=17
gpio.led.pin=27

countdown.seconds=3

# Port the local download server listens on. A Cloudflare quick tunnel
# (cloudflared must be installed, this machine needs outbound internet)
# exposes it on the public internet so guests reach their photo over mobile data.
server.port=8080

# Where originals/merged photos/QR codes are written, relative to the
# working directory the app is launched from.
data.dir=data

# Transparent PNG (same aspect ratio as the camera resolution) drawn on top
# of every captured photo.
overlay.file=config/overlay.png
overlay.selection.enabled=true
overlays.dir=config/overlays

# Idle-screen decoration for "Tibo's uitzwaai feestje" — see docs/screen-decoration.md.
# NOTE: wimpels.png and wegwijzer.png still have an opaque/gradient background;
# cut them out to transparent or they'll show as a rectangle over the camera feed.

# Flags, tilted into the top-left corner
decor.1.file=config/decor/wimpels.png
decor.1.position=top-left
decor.1.width=48%
decor.1.rotate=-10

# The party name where the title used to be
decor.2.file=config/decor/uitzwaaifeest.png
decor.2.position=top-center
decor.2.width=42%

# The signpost, top-right (the recovery QR sits under it, see kiosk.qr.recovery.position below)
decor.3.file=config/decor/wegwijzer.png
decor.3.position=top-right
decor.3.height=58%

# No text title — the image above is the title.
decor.title.text=

kiosk.qr.layout.position=center-left
kiosk.qr.recovery.position=bottom-right
kiosk.taphint.position=bottom-center
